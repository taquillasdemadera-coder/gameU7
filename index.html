<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Editor de Video</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 10px; background: #111; color: #fff; }
    video { width: 100%; margin-top: 10px; }
    button, input { margin: 5px; padding: 10px; }
    .controls { display: flex; flex-wrap: wrap; }
  </style>
</head>
<body><h2>Editor de Video Simple (FFmpeg)</h2>
<input type="file" id="upload" accept="video/*"><video id="preview" controls></video>

<div class="controls">
  <button onclick="trim()">✂️ Recortar 0-5s</button>
  <button onclick="zoom()">🔍 Zoom</button>
  <button onclick="split()">📂 Dividir en 2</button>
</div><a id="download" style="display:none">Descargar</a>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  const ffmpeg = createFFmpeg({ log: true });

  const video = document.getElementById('preview');
  const upload = document.getElementById('upload');
  const download = document.getElementById('download');

  let filename = 'input.mp4';

  upload.onchange = async (e) => {
    const file = e.target.files[0];
    video.src = URL.createObjectURL(file);

    if (!ffmpeg.isLoaded()) await ffmpeg.load();

    ffmpeg.FS('writeFile', filename, await fetchFile(file));
  };

  async function trim() {
    await ffmpeg.run('-i', filename, '-ss', '0', '-to', '5', '-c', 'copy', 'out.mp4');
    exportVideo('out.mp4');
  }

  async function zoom() {
    await ffmpeg.run(
      '-i', filename,
      '-vf', 'scale=iw*1.5:ih*1.5',
      'zoom.mp4'
    );
    exportVideo('zoom.mp4');
  }

  async function split() {
    await ffmpeg.run('-i', filename, '-t', '5', '-c', 'copy', 'part1.mp4');
    await ffmpeg.run('-i', filename, '-ss', '5', '-c', 'copy', 'part2.mp4');
    exportVideo('part1.mp4');
  }

  function exportVideo(name) {
    const data = ffmpeg.FS('readFile', name);
    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

    video.src = url;
    download.href = url;
    download.download = name;
    download.style.display = 'block';
    download.innerText = '⬇️ Descargar ' + name;
  }
</script></body>
</html>
