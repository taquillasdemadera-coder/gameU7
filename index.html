<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor Multimedia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      cursor: pointer;
      background: #28a745;
      color: white;
    }
    video, audio, iframe {
      margin-top: 20px;
      max-width: 90%;
      border-radius: 12px;
    }
    iframe {
      width: 80%;
      height: 450px;
    }
    a.download {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>  <h1>🎵 Reproductor Multimedia</h1>  <input type="text" id="urlInput" placeholder="Pega aquí el enlace (mp4, mp3, YouTube, etc)">
  <br>
  <button onclick="loadMedia()">Cargar</button>  <div id="player"></div>
  <div id="download"></div>  <script>
    function getYouTubeID(url) {
      const regExp = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function loadMedia() {
      const url = document.getElementById('urlInput').value;
      const playerDiv = document.getElementById('player');
      const downloadDiv = document.getElementById('download');

      playerDiv.innerHTML = '';
      downloadDiv.innerHTML = '';

      if (!url) return;

      let media;

      // YouTube
      const ytID = getYouTubeID(url);
      if (ytID) {
        media = document.createElement('iframe');
        media.src = `https://www.youtube.com/embed/${ytID}`;
        media.frameBorder = "0";
        media.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        media.allowFullscreen = true;

        playerDiv.appendChild(media);

        downloadDiv.innerHTML = '<p>No se puede descargar directamente desde YouTube por restricciones.</p>';
        return;
      }

      // Video
      if (url.match(/\.(mp4|webm|ogg)$/i)) {
        media = document.createElement('video');
        media.controls = true;
      }
      // Audio
      else if (url.match(/\.(mp3|wav|ogg)$/i)) {
        media = document.createElement('audio');
        media.controls = true;
      }
      else {
        playerDiv.innerHTML = '<p>Formato no soportado directamente.</p>';
        return;
      }

      media.src = url;
      playerDiv.appendChild(media);

      // Botón de descarga
      const link = document.createElement('a');
      link.href = url;
      link.download = '';
      link.className = 'download';
      link.innerText = '⬇️ Descargar archivo';

      downloadDiv.appendChild(link);
    }
  </script></body>
</html>
