<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>3D Vocabulary Runner Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; background: #000; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 10px;
      z-index: 10;
    }
    #feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body><div id="ui">
  <div id="level">Nivel 1</div>
  <div id="score">Score: 0</div>
  <div id="word">Loading...</div>
</div>
<div id="feedback"></div><script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script><script>
// ===== SCENE =====
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 50);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(0,10,10);
scene.add(light);

// ===== AUDIO =====
const music = new Howl({
  src: ["https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9bba82.mp3"],
  loop: true,
  volume: 0.3
});

document.body.addEventListener("click", ()=> music.play(), { once:true });

// ===== LANES =====
const lanes = [-2, 0, 2];
let playerLane = 1;

// ===== PLAYER =====
const player = new THREE.Mesh(
  new THREE.BoxGeometry(0.8,0.8,0.8),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
player.position.y = 0.5;
scene.add(player);

// ===== DATA =====
const level1 = [
  "angry","annoyed","down","ridiculous","grateful",
  "insecure","eager","peaceful","hurt","thrilled"
];

const level2 = [
  "learn by heart","make my mind up","in two minds","on my mind",
  "break his heart","close to my heart","change my mind","put my heart into"
];

let level = 1;
let words = level1;
let index = 0;
let score = 0;

// ===== TILE SYSTEM =====
const tiles = [];

function createTile(word, lane, isCorrect) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = isCorrect ? "green" : "white";
  ctx.fillRect(0,0,256,128);

  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.fillText(word, 128, 70);

  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshStandardMaterial({ map: tex });

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1.5,0.2,1.5),
    mat
  );

  mesh.position.set(lanes[lane],0, -30);
  mesh.userData = { lane, isCorrect };

  scene.add(mesh);
  tiles.push(mesh);
}

function spawnRow() {
  const correctLane = Math.floor(Math.random()*3);
  const correctWord = words[index % words.length];

  for (let i=0;i<3;i++) {
    const word = (i === correctLane) ? correctWord : words[Math.floor(Math.random()*words.length)];
    createTile(word, i, i === correctLane);
  }
}

// ===== GAME FLOW =====
function next() {
  index++;
  document.getElementById("word").innerText = "Find: " + words[index % words.length];

  if (index % 5 === 0) spawnRow();

  if (index === 10 && level === 1) {
    level = 2;
    words = level2;
    document.getElementById("level").innerText = "Nivel 2";
  }
}

next();
spawnRow();

// ===== INPUT =====
window.addEventListener("keydown", (e)=>{
  if (e.key === "ArrowLeft") playerLane = Math.max(0, playerLane-1);
  if (e.key === "ArrowRight") playerLane = Math.min(2, playerLane+1);
});

// ===== COLLISION =====
function checkCollision(tile) {
  if (Math.abs(tile.position.z - player.position.z) < 1.2) {
    if (tile.userData.lane === playerLane) {
      if (tile.userData.isCorrect) {
        score += 10;
        show("CORRECT", "green");
      } else {
        score -= 5;
        show("WRONG", "red");
      }
      document.getElementById("score").innerText = "Score: " + score;
      next();
    }
  }
}

function show(text, color) {
  const f = document.getElementById("feedback");
  f.innerText = text;
  f.style.color = color;
  setTimeout(()=> f.innerText = "", 800);
}

// ===== LOOP =====
function animate() {
  requestAnimationFrame(animate);

  player.position.x += (lanes[playerLane] - player.position.x) * 0.2;

  tiles.forEach(t => {
    t.position.z += 0.15;
    checkCollision(t);
  });

  renderer.render(scene, camera);
}

animate();
</script></body>
</html>
